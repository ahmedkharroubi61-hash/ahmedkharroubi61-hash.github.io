  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") || "light dark";
      var l = localStorage.getItem("lang") || ((navigator.language || "en").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");

<body data-page="404">

          <span class="sr-only t-dark" data-i18n="theme.toDark">Switch to dark theme</span>
          <span class="sr-only t-light" data-i18n="theme.toLight">Switch to light theme</span>
